name: Build APKG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apkg:
    name: Build APKG with Nix
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - name: Build APKG package
        run: nix build --impure --out-link result --print-build-logs

      - name: Define release metadata
        id: release_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_STAMP="$(date -u +%Y%m%d-%H%M%S)"
          RELEASE_NAME="anki-hanzi-${BUILD_STAMP}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Collect build artifacts
        env:
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
          SHORT_SHA: ${{ steps.release_meta.outputs.short_sha }}
        run: |
          mkdir -p ci-artifacts
          cp -L result/anki-hanzi-${SHORT_SHA}.apkg ci-artifacts/
          cp -L result/anki-hanzi-migrator-${SHORT_SHA}.ankiaddon ci-artifacts/
          {
            echo "# anki-hanzi APKG build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build ID: \`${GITHUB_SHA::7}\`"
            echo "- Source ref: \`${GITHUB_REF_NAME}\`"
            echo
            echo "## Included artifacts"
            echo
            echo "- \`anki-hanzi-${SHORT_SHA}.apkg\`"
            echo "- \`anki-hanzi-migrator-${SHORT_SHA}.ankiaddon\`"
            echo
            echo "## Migration add-on"
            echo
            echo "Release names use a UTC timestamp plus the target build hash."
            echo "APKG and migrator add-on filenames keep the plain target build hash."
            echo "Install the migrator add-on in Anki, create a full collection backup,"
            echo "then open Tools -> Anki Hanzi Migrator -> Migrate Deck..."
            echo "Select the existing deck root and target APKG, review the required"
            echo "package list and each preflight dialog, and apply only when the add-on"
            echo "reports that the migration step is safe."
          } > ci-artifacts/README.md

      - name: Upload APKG artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release_meta.outputs.release_name }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
        run: |
          TAG="$RELEASE_NAME"
          TITLE="$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ci-artifacts/* --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file ci-artifacts/README.md
          else
            gh release create "$TAG" ci-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file ci-artifacts/README.md
          fi
